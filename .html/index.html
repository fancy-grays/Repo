<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grace Ikhajiagbe | Frontend Developer &amp; Project Manager</title>
    <meta
      name="description"
      content="Meet Grace Ikhajiagbe, aspiring frontend developer and technical project manager."
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <section class="welcome" aria-labelledby="welcome-title">
        <header class="welcome-header">
          <span class="monogram" aria-label="Grace Ikhajiagbe">gi.</span>
          <span class="portfolio-label">Personal portfolio</span>
        </header>

        <div class="welcome-content">
          <svg class="welcome-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path
                d="M24 4v40M4 24h40M10 10l28 28M10 38l28-28M16.3 5.5l15.4 37M5.5 16.3l37 15.4M5.5 31.7l37-15.4M16.3 42.5l15.4-37"
              />
            </g>
          </svg>

          <p class="welcome-eyebrow">Hello, welcome to my little corner of the web.</p>
          <h1 id="welcome-title" class="welcome-title">Grace<br />Ikhajiagbe</h1>
          <p class="welcome-subtitle">
            Aspiring Frontend Developer,<br />Technical Project Manager
          </p>

          <button type="button" class="welcome-cta" id="projects-button">
            <span>view my projects</span>
            <svg
              class="welcome-cta-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M7 17 17 7" />
              <path d="M8 7h9v9" />
            </svg>
          </button>
        </div>

        <footer class="welcome-footer">
          <span>A curious mind. A creative spirit.</span>
          <span>Thanks for stopping by.</span>
        </footer>
      </section>

      <dialog class="projects-dialog" id="projects-dialog" aria-labelledby="projects-title">
        <h2 id="projects-title">My projects</h2>
        <p>Projects coming soon.</p>
        <button type="button" class="dialog-close" id="projects-close">Close</button>
      </dialog>
    </main>

    <script src="script.js"></script>
  </body>
</html>
