<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <header>
        <h1>Our Products</h1>
        <p>Discover products made for you.</p>
        <button id="theme-toggle">🌙 Dark Mode</button>
    </header>

    <main class="product-gallery">

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
                 alt="Red sneaker">
            <div class="product-info">
                <h2>Classic Sneakers</h2>
                <p>Comfortable shoes for everyday adventures.</p>
                <h3>₦45,000</h3>
                <button class="buy-btn">View Product</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"
                 alt="Minimal wristwatch">
            <div class="product-info">
                <h2>Classic Watch</h2>
                <p>A timeless accessory for every occasion.</p>
                <h3>₦65,000</h3>
                <button class="buy-btn">View Product</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1547949003-9792a18a2601?w=600"
                 alt="Stylish handbag">
            <div class="product-info">
                <h2>Everyday Bag</h2>
                <p>Carry your essentials in effortless style.</p>
                <h3>₦35,000</h3>
                <button class="buy-btn">View Product</button>
            </div>
        </div>

    </main>
 <script src="script.js"></script>
</body>
</html>
